openapi: 3.1.0
info:
  title: RawDrive Assets API
  description: Asset upload, management, and processing endpoints
  version: 1.0.0
  contact:
    name: RawDrive API Support
    email: api@RawDrive.io

servers:
  - url: https://app.RawDrive.io/api/v1
    description: Production
  - url: http://localhost:8008/api/v1
    description: Upload service (local)

tags:
  - name: Upload
    description: TUS resumable upload endpoints
  - name: Assets
    description: Asset management
  - name: Processing
    description: Asset processing and analysis

paths:
  /upload/init:
    post:
      tags:
        - Upload
      summary: Initialize upload
      description: Create a new TUS upload session
      operationId: initUpload
      security:
        - bearerAuth: []
      parameters:
        - name: Upload-Length
          in: header
          required: true
          schema:
            type: integer
          description: Total file size in bytes
        - name: Upload-Metadata
          in: header
          required: true
          schema:
            type: string
          description: Base64-encoded metadata (filename, filetype, gallery_id)
      responses:
        '201':
          description: Upload session created
          headers:
            Location:
              schema:
                type: string
              description: Upload endpoint URL
            Tus-Resumable:
              schema:
                type: string
                enum: ['1.0.0']
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /upload/{uploadId}:
    head:
      tags:
        - Upload
      summary: Get upload status
      description: Check current upload progress
      operationId: getUploadStatus
      security:
        - bearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upload status
          headers:
            Upload-Offset:
              schema:
                type: integer
              description: Current upload offset in bytes
            Upload-Length:
              schema:
                type: integer
              description: Total file size
            Tus-Resumable:
              schema:
                type: string
        '404':
          description: Upload not found

    patch:
      tags:
        - Upload
      summary: Upload chunk
      description: Upload a file chunk (TUS protocol)
      operationId: uploadChunk
      security:
        - bearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            enum: ['application/offset+octet-stream']
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Chunk uploaded
          headers:
            Upload-Offset:
              schema:
                type: integer
              description: New upload offset
            Tus-Resumable:
              schema:
                type: string
        '409':
          description: Offset mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Upload not found

    delete:
      tags:
        - Upload
      summary: Cancel upload
      description: Cancel and cleanup an upload session
      operationId: cancelUpload
      security:
        - bearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Upload cancelled
        '404':
          description: Upload not found

  /assets/{assetId}:
    get:
      tags:
        - Assets
      summary: Get asset
      description: Get asset details and signed URLs
      operationId: getAsset
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Assets
      summary: Update asset
      description: Update asset metadata
      operationId: updateAsset
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdateRequest'
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Assets
      summary: Delete asset
      description: Soft delete an asset
      operationId: deleteAsset
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asset deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/{assetId}/url:
    get:
      tags:
        - Assets
      summary: Get signed URL
      description: Get a signed URL for asset download
      operationId: getAssetUrl
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          schema:
            type: string
            enum: [original, thumbnail_xs, thumbnail_sm, thumbnail_md, thumbnail_lg]
            default: original
        - name: expires_in
          in: query
          schema:
            type: integer
            minimum: 60
            maximum: 86400
            default: 3600
          description: URL expiry in seconds
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/{assetId}/thumbnail:
    get:
      tags:
        - Assets
      summary: Get thumbnail
      description: Get thumbnail URL for an asset
      operationId: getAssetThumbnail
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          schema:
            type: string
            enum: [xs, sm, md, lg]
            default: md
      responses:
        '200':
          description: Thumbnail URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/{assetId}/exif:
    get:
      tags:
        - Assets
      summary: Get EXIF data
      description: Get extracted EXIF metadata for an asset
      operationId: getAssetExif
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: EXIF data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExifResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/{assetId}/analyze:
    post:
      tags:
        - Processing
      summary: Trigger AI analysis
      description: Queue asset for AI analysis (tags, faces, quality)
      operationId: analyzeAsset
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '202':
          description: Analysis queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/{assetId}/select:
    post:
      tags:
        - Assets
      summary: Toggle selection
      description: Mark or unmark asset as selected
      operationId: toggleAssetSelection
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selected:
                  type: boolean
      responses:
        '200':
          description: Selection updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/{assetId}/favorite:
    post:
      tags:
        - Assets
      summary: Toggle favorite
      description: Mark or unmark asset as favorite
      operationId: toggleAssetFavorite
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                favorite:
                  type: boolean
      responses:
        '200':
          description: Favorite updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/batch:
    post:
      tags:
        - Assets
      summary: Batch operations
      description: Perform batch operations on multiple assets
      operationId: batchAssetOperations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchOperationRequest'
      responses:
        '200':
          description: Batch operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /assets/reorder:
    post:
      tags:
        - Assets
      summary: Reorder assets
      description: Update sort order for multiple assets
      operationId: reorderAssets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: Assets reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gallery_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        asset_type:
          type: string
          enum: [image, video, raw]
        thumbnail_url:
          type: string
          format: uri
        preview_url:
          type: string
          format: uri
        width:
          type: integer
        height:
          type: integer
        orientation:
          type: string
          enum: [portrait, landscape, square]
        duration_seconds:
          type: number
          nullable: true
        exif_data:
          $ref: '#/components/schemas/ExifData'
        ai_tags:
          type: array
          items:
            type: string
        ai_description:
          type: string
          nullable: true
        ai_quality_score:
          type: number
          nullable: true
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        is_selected:
          type: boolean
        is_favorite:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Asset'

    AssetUpdateRequest:
      type: object
      properties:
        file_name:
          type: string
          maxLength: 255
        ai_tags:
          type: array
          items:
            type: string
        ai_description:
          type: string
          maxLength: 1000

    SignedUrlResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            url:
              type: string
              format: uri
            expires_at:
              type: string
              format: date-time

    ExifData:
      type: object
      properties:
        camera:
          type: string
        lens:
          type: string
        iso:
          type: integer
        aperture:
          type: string
        shutter_speed:
          type: string
        focal_length:
          type: string
        date_time:
          type: string
          format: date-time
        gps:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number

    ExifResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ExifData'

    AnalyzeRequest:
      type: object
      properties:
        features:
          type: array
          items:
            type: string
            enum: [tags, faces, quality, description]
          default: [tags, faces, quality]

    AnalyzeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            job_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued]
            estimated_time_seconds:
              type: integer

    BatchOperationRequest:
      type: object
      required:
        - asset_ids
        - operation
      properties:
        asset_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
        operation:
          type: string
          enum: [delete, select, unselect, favorite, unfavorite, move]
        target_gallery_id:
          type: string
          format: uuid
          description: Required for move operation

    BatchOperationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            processed:
              type: integer
            failed:
              type: integer
            errors:
              type: array
              items:
                type: object
                properties:
                  asset_id:
                    type: string
                    format: uuid
                  error:
                    type: string

    ReorderRequest:
      type: object
      required:
        - gallery_id
        - asset_order
      properties:
        gallery_id:
          type: string
          format: uuid
        asset_order:
          type: array
          items:
            type: object
            properties:
              asset_id:
                type: string
                format: uuid
              sort_order:
                type: integer

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          enum: [VALIDATION_ERROR]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

security:
  - bearerAuth: []
