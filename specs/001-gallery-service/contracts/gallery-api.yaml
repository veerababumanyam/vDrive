# ============================================================================
# Components: Reusable Schemas
# ============================================================================

components:
  securitySchemes:
    MagicLinkToken:
      type: apiKey
      in: header
      name: X-Magic-Link-Token
      description: Magic Link token for public gallery access
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for staff endpoints

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code
          example: "link_expired"
        message:
          type: string
          description: Human-readable error message
          example: "This Magic Link has expired"
        details:
          type: array
          items:
            type: object
          description: Additional error details (optional)

    MagicLinkAccessResponse:
      type: object
      required:
        - gallery_id
        - title
        - layout_style
        - allowed_actions
      properties:
        gallery_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Smith Wedding - June 2026"
        description:
          type: string
        client_name:
          type: string
        shoot_date:
          type: string
          format: date
        layout_style:
          type: string
          enum: [tab, continuous_scroll]
        theme:
          type: string
          example: "light"
        password_protected:
          type: boolean
        email_registration_required:
          type: boolean
        allowed_actions:
          type: array
          items:
            type: string
            enum: [view, favorite, select, comment, download]
        download_policy:
          type: string
          enum: [VIEW_ONLY, WEB_ONLY, WATERMARKED_ONLY, ORIGINAL_ALLOWED]
        sub_galleries:
          type: array
          items:
            $ref: '#/components/schemas/SubGallery'
        stats:
          $ref: '#/components/schemas/GalleryStats'

    SubGallery:
      type: object
      properties:
        sub_gallery_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Ceremony"
        description:
          type: string
        sort_order:
          type: integer
        visible:
          type: boolean
        cover_asset_id:
          type: string
          format: uuid
        photo_count:
          type: integer

    GalleryStats:
      type: object
      properties:
        photo_count:
          type: integer
          example: 250
        video_count:
          type: integer
          example: 5
        favorites_count:
          type: integer
          example: 42
        total_size_bytes:
          type: integer
          format: int64
          example: 5368709120

    GalleryPhotosResponse:
      type: object
      required:
        - photos
        - has_more
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/GalleryPhoto'
        next_cursor:
          type: string
          description: Cursor for next page (null if no more pages)
        has_more:
          type: boolean
          description: Whether more pages are available
        total_count:
          type: integer
          description: Total photo count (from denormalized stats)

    GalleryPhoto:
      type: object
      required:
        - asset_id
        - lqip
        - thumbnail_url
      properties:
        asset_id:
          type: string
          format: uuid
        sub_gallery_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [photo, video]
        width:
          type: integer
        height:
          type: integer
        lqip:
          type: string
          description: Base64-encoded WebP data URI (16x16, ~100-200 bytes)
          example: "data:image/webp;base64,UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAwA0JaQAA3AA/vuUAAA="
        thumbnail_url:
          type: string
          format: uri
          description: Signed URL for 800x600 thumbnail (4-hour TTL)
        full_url:
          type: string
          format: uri
          description: Signed URL for full-size photo (1-hour TTL, only if download allowed)
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        is_private:
          type: boolean
          description: Whether photo requires PIN to view
        favorites_count:
          type: integer
        selections_count:
          type: integer
        date_taken:
          type: string
          format: date-time
        exif_data:
          type: object
          description: EXIF metadata (camera model, ISO, aperture, etc.)
