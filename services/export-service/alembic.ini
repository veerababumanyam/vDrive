# Alembic Configuration for Export Service
#
# This configuration file is used by Alembic to manage database migrations.
# The actual database URL is read from the environment via src.app.core.config.

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path for finding 'src' module
prepend_sys_path = .

# Timezone for migration files (UTC for consistency)
timezone = UTC

# Truncate revision to specific length (None for full)
truncate_slug_length = 40

# Set to 'true' to run the environment every time with migration
revision_environment = false

# Source of the migration version after revision is created
sourceless = false

# Version locations (default uses script_location/versions)
# version_locations = %(here)s/versions

# Version path separator for multiple version_locations
version_path_separator = os

# Output encoding for files generated by alembic
output_encoding = utf-8

# SQLAlchemy URL - override with environment variable
# Note: The actual URL is loaded from settings in env.py
sqlalchemy.url =

[post_write_hooks]
# Hooks run after migration files are generated
# Format code with black
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
