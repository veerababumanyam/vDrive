[pytest]
# Pytest configuration for Processing Service

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Test settings
addopts =
    --verbose
    --strict-markers
    --tb=short

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

# Ignore
norecursedirs = .git .tox build dist *.egg

# Logging
log_cli = true
log_cli_level = INFO
