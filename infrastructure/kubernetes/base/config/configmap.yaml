# ===========================================
# vDrive Shared Configuration
# ===========================================
# Common configuration for all microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: vDrive-config
  namespace: vDrive
  labels:
    app.kubernetes.io/part-of: vDrive-platform
data:
  # Application
  APP_NAME: "vDrive"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"

  # Database
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "vDrive"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"

  # Service Discovery (Internal DNS)
  BACKEND_URL: "http://backend:8000"
  GALLERY_SERVICE_URL: "http://gallery-service:8004"
  BILLING_SERVICE_URL: "http://billing-service:8005"
  UPLOAD_SERVICE_URL: "http://upload-service:8008"
  FACE_SERVICE_URL: "http://face-service:8002"
  WEBHOOKS_SERVICE_URL: "http://webhooks-service:8003"
  ONBOARDING_SERVICE_URL: "http://onboarding-service:8006"
  INVITATIONS_SERVICE_URL: "http://invitations-service:8007"
  NOTIFICATIONS_SERVICE_URL: "http://notifications-service:8010"

  # Celery
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"

  # JWT Settings
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # CORS
  CORS_ORIGINS: "https://app.vDrive.com,http://localhost:5173"

  # Rate Limiting
  RATE_LIMIT_PER_MINUTE: "100"

  # Prometheus Metrics
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
