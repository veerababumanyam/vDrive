# ===========================================
# RawDrive Secrets
# ===========================================
# IMPORTANT: In production, use external secret management
# (Sealed Secrets, External Secrets Operator, Vault, etc.)
# These are placeholder values - CHANGE BEFORE DEPLOYMENT!

apiVersion: v1
kind: Secret
metadata:
  name: RawDrive-secrets
  namespace: RawDrive
  labels:
    app.kubernetes.io/part-of: RawDrive-platform
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://RawDrive:CHANGE_ME_IN_PRODUCTION@postgres:5432/RawDrive"
  POSTGRES_USER: "RawDrive"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # JWT Secret (generate with: openssl rand -hex 64)
  JWT_SECRET: "CHANGE_ME_GENERATE_64_BYTE_HEX_SECRET_WITH_OPENSSL"

  # Redis Password (if enabled)
  REDIS_PASSWORD: ""

  # Cloudflare R2 Storage
  R2_ACCESS_KEY_ID: "CHANGE_ME"
  R2_SECRET_ACCESS_KEY: "CHANGE_ME"
  R2_BUCKET_NAME: "RawDrive-assets"
  R2_ENDPOINT_URL: "https://ACCOUNT_ID.r2.cloudflarestorage.com"

  # Stripe (Payment Processing)
  STRIPE_SECRET_KEY: "sk_test_CHANGE_ME"
  STRIPE_PUBLISHABLE_KEY: "pk_test_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"

  # Razorpay (India Payments)
  RAZORPAY_KEY_ID: "rzp_test_CHANGE_ME"
  RAZORPAY_KEY_SECRET: "CHANGE_ME"
  RAZORPAY_WEBHOOK_SECRET: "CHANGE_ME"

  # SendGrid (Email)
  SENDGRID_API_KEY: "SG.CHANGE_ME"
  SENDGRID_FROM_EMAIL: "noreply@RawDrive.com"

  # Google Cloud (AI/Face Detection)
  GCP_PROJECT_ID: "CHANGE_ME"
  GOOGLE_APPLICATION_CREDENTIALS_JSON: "{}"

  # Gemini API
  GEMINI_API_KEY: "CHANGE_ME"
---
# Separate secret for image pull (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: RawDrive-registry
  namespace: RawDrive
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded docker config json
  # Generate with: kubectl create secret docker-registry RawDrive-registry --docker-server=ghcr.io --docker-username=USER --docker-password=TOKEN --dry-run=client -o yaml
  .dockerconfigjson: e30=
