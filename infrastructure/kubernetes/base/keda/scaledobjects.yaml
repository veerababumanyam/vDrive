# ===========================================
# KEDA ScaledObjects for vDrive Services
# ===========================================
# Prerequisites: kubectl apply -f https://github.com/kedacore/keda/releases/download/v2.12.0/keda-2.12.0.yaml

# Backend Service Autoscaling
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend-scaledobject
  namespace: vDrive
spec:
  scaleTargetRef:
    name: backend
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 100
  triggers:
    # Scale based on HTTP request rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: traefik_service_requests_total
        query: sum(rate(traefik_service_requests_total{service="backend@kubernetes"}[1m]))
        threshold: "100"
    # Scale based on P95 latency
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: traefik_service_request_duration_seconds
        query: histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket{service="backend@kubernetes"}[5m])) by (le))
        threshold: "0.5"
---
# Gallery Service Autoscaling (High Traffic + WebSocket)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: gallery-service-scaledobject
  namespace: vDrive
spec:
  scaleTargetRef:
    name: gallery-service
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 5
  maxReplicaCount: 100
  triggers:
    # Scale based on HTTP request rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: traefik_service_requests_total
        query: sum(rate(traefik_service_requests_total{service="gallery-service@kubernetes"}[1m]))
        threshold: "100"
    # Scale based on active WebSocket connections
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: websocket_active_connections
        query: sum(websocket_active_connections)
        threshold: "500"
    # Scale based on WebSocket messages sent (activity)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: websocket_messages_sent
        query: sum(rate(websocket_messages_sent[5m]))
        threshold: "1000"
    # Scale based on Kafka gallery update events
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: gallery-updates
        topic: gallery.updated
        lagThreshold: "100"
---
# Upload Service Autoscaling (Kafka-based)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: upload-service-scaledobject
  namespace: vDrive
spec:
  scaleTargetRef:
    name: upload-service
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 50
  triggers:
    # Scale based on Kafka consumer lag
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: upload-processor
        topic: upload.completed
        lagThreshold: "100"
    # Scale based on HTTP request rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: traefik_service_requests_total
        query: sum(rate(traefik_service_requests_total{service="upload-service@kubernetes"}[1m]))
        threshold: "50"
---
