# AI Search Service Autoscaling
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ai-search-service-scaledobject
  namespace: vDrive
spec:
  scaleTargetRef:
    name: ai-search-service
  pollingInterval: 15
  cooldownPeriod: 120  # Longer cooldown for AI workloads
  minReplicaCount: 2
  maxReplicaCount: 50
  triggers:
    # Scale based on Kafka consumer lag for embedding generation
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: embedding-processor
        topic: asset.embedding.generated
        lagThreshold: "50"
    # Scale based on HTTP request rate (semantic search queries)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: traefik_service_requests_total
        query: sum(rate(traefik_service_requests_total{service="ai-search-service@kubernetes"}[1m]))
        threshold: "30"
    # Scale based on RAG chat requests
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: ai_chat_messages_total
        query: sum(rate(ai_chat_messages_total[5m]))
        threshold: "10"
---
# Celery Worker Autoscaling (Redis-based)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-worker-scaledobject
  namespace: vDrive
spec:
  scaleTargetRef:
    name: celery-worker
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    # Scale based on Redis queue length
    - type: redis
      metadata:
        address: redis:6379
        listName: celery
        listLength: "100"
        databaseIndex: "1"
