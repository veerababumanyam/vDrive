apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: onboarding-service-scaledobject
  namespace: RawDrive
  labels:
    app: onboarding-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: onboarding-service
    kind: Deployment

  # Scaling configuration
  minReplicaCount: 2
  maxReplicaCount: 20
  cooldownPeriod: 300    # 5 minutes cooldown after scale down
  pollingInterval: 30    # Check metrics every 30 seconds

  # Scaling behavior
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max

  triggers:
    # Scale based on HTTP request rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: http_requests_rate
        query: |
          sum(rate(http_requests_total{service="onboarding-service"}[2m]))
        threshold: "100"  # Scale up when requests/sec > 100

    # Scale based on registration rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: registration_rate
        query: |
          sum(rate(registration_total{service="onboarding-service",status="success"}[5m]))
        threshold: "10"  # Scale up when registrations/sec > 10

    # Scale based on CPU usage
    - type: cpu
      metadata:
        type: Utilization
        value: "70"

    # Scale based on memory usage
    - type: memory
      metadata:
        type: Utilization
        value: "80"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: prometheus-trigger-auth
  namespace: RawDrive
spec:
  secretTargetRef: []
