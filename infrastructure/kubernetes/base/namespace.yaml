# ===========================================
# RawDrive Kubernetes Namespace
# ===========================================
apiVersion: v1
kind: Namespace
metadata:
  name: RawDrive
  labels:
    app.kubernetes.io/name: RawDrive
    app.kubernetes.io/part-of: RawDrive-platform
---
# Resource Quota for the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: RawDrive-quota
  namespace: RawDrive
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "5"
---
# Limit Range for default resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: RawDrive-limit-range
  namespace: RawDrive
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
