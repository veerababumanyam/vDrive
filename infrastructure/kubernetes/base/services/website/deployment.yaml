---
# Website Service Deployment
# Public marketing website at www.RawDrive.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: RawDrive
  labels:
    app: website
    app.kubernetes.io/name: website
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: RawDrive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: website
        app.kubernetes.io/name: website
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: RawDrive-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: website
          image: ghcr.io/RawDrive/website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8011
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8011"
            - name: SITE_URL
              value: "https://www.RawDrive.io"
            - name: APP_URL
              value: "https://app.RawDrive.io"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: RawDrive-registry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - website
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
---
# Website Service
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: RawDrive
  labels:
    app: website
    app.kubernetes.io/name: website
spec:
  type: ClusterIP
  ports:
    - port: 8011
      targetPort: 8011
      protocol: TCP
      name: http
  selector:
    app: website
