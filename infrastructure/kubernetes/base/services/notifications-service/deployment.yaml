# ===========================================
# Notifications Service Deployment
# ===========================================
# Multi-channel notifications (email, push, in-app)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: vDrive
  labels:
    app: notifications-service
    app.kubernetes.io/name: notifications-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
        app.kubernetes.io/name: notifications-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8010"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vDrive-service
      containers:
        - name: notifications-service
          image: ghcr.io/vDrive/notifications-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8010
              name: http
          envFrom:
            - configMapRef:
                name: vDrive-config
            - secretRef:
                name: vDrive-secrets
          env:
            - name: SERVICE_NAME
              value: "notifications-service"
            - name: PORT
              value: "8010"
            - name: KAFKA_TOPIC_NOTIFICATION_SEND
              value: "notification.send"
            - name: EMAIL_PROVIDER
              value: "sendgrid"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: vDrive-registry
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: vDrive
spec:
  type: ClusterIP
  ports:
    - port: 8010
      targetPort: 8010
      name: http
  selector:
    app: notifications-service
