# ===========================================
# Webhooks Service Deployment
# ===========================================
# Event-driven webhook delivery with HMAC signing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks-service
  namespace: vDrive
  labels:
    app: webhooks-service
    app.kubernetes.io/name: webhooks-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhooks-service
  template:
    metadata:
      labels:
        app: webhooks-service
        app.kubernetes.io/name: webhooks-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vDrive-service
      containers:
        - name: webhooks-service
          image: ghcr.io/vDrive/webhooks-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - configMapRef:
                name: vDrive-config
            - secretRef:
                name: vDrive-secrets
          env:
            - name: SERVICE_NAME
              value: "webhooks-service"
            - name: PORT
              value: "8003"
            # Webhook-specific config
            - name: WEBHOOK_MAX_RETRIES
              value: "10"
            - name: WEBHOOK_INITIAL_RETRY_DELAY_MS
              value: "1000"
            - name: WEBHOOK_MAX_RETRY_DELAY_MS
              value: "3600000"
            - name: CIRCUIT_BREAKER_THRESHOLD
              value: "5"
            - name: CIRCUIT_BREAKER_TIMEOUT_MS
              value: "60000"
            - name: KAFKA_TOPIC_WEBHOOK_PENDING
              value: "webhook.pending"
            - name: KAFKA_TOPIC_WEBHOOK_DLQ
              value: "webhook.dlq"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      imagePullSecrets:
        - name: vDrive-registry
---
apiVersion: v1
kind: Service
metadata:
  name: webhooks-service
  namespace: vDrive
  labels:
    app: webhooks-service
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
      name: http
  selector:
    app: webhooks-service
