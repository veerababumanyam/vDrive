# ===========================================
# Onboarding Service Deployment
# ===========================================
# User registration, email verification, workspace creation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-service
  namespace: vDrive
  labels:
    app: onboarding-service
    app.kubernetes.io/name: onboarding-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onboarding-service
  template:
    metadata:
      labels:
        app: onboarding-service
        app.kubernetes.io/name: onboarding-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8006"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vDrive-service
      containers:
        - name: onboarding-service
          image: ghcr.io/vDrive/onboarding-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
              name: http
          envFrom:
            - configMapRef:
                name: vDrive-config
            - secretRef:
                name: vDrive-secrets
          env:
            - name: SERVICE_NAME
              value: "onboarding-service"
            - name: PORT
              value: "8006"
            - name: EMAIL_VERIFICATION_EXPIRY_HOURS
              value: "24"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: vDrive-registry
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-service
  namespace: vDrive
spec:
  type: ClusterIP
  ports:
    - port: 8006
      targetPort: 8006
      name: http
  selector:
    app: onboarding-service
