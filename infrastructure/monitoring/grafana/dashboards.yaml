# ===========================================
# Grafana Dashboard Provisioning
# ===========================================
# vDrive Dashboard Configuration

apiVersion: 1

providers:
  - name: 'vDrive Dashboards'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
