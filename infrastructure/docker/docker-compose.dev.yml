networks:
  vDrive-network:
    driver: bridge
    name: vDrive-network

volumes:
  postgres_data:
    name: vDrive-postgres-data
  redis_data:
    name: vDrive-redis-data
  zookeeper_data:
    name: vDrive-zookeeper-data
  zookeeper_log:
    name: vDrive-zookeeper-log
  kafka_data:
    name: vDrive-kafka-data
  prometheus_data:
    name: vDrive-prometheus-data
  grafana_data:
    name: vDrive-grafana-data
  alertmanager_data:
    name: vDrive-alertmanager-data
  loki_data:
    name: vDrive-loki-data
  minio_data:
    name: vDrive-minio-data
  etcd_data:
    name: vDrive-etcd-data
  milvus_data:
    name: vDrive-milvus-data
