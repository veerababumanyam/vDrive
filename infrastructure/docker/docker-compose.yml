# vDrive Full Production Stack
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d

name: vDrive

services:
  # ===================
  # PostgreSQL 16 with pgvector + pgvectorscale
  # ===================
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: vDrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vDrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vDrive_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vDrive}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vDrive} -d ${POSTGRES_DB:-vDrive}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vDrive-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ===================
  # Redis 7 - Cache, Sessions, Celery Broker
  # ===================
  redis:
    image: redis:7-alpine
    container_name: vDrive-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vDrive-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ===================
  # Traefik v3 API Gateway
  # ===================
  traefik:
    image: traefik:v3.0
    container_name: vDrive-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
      - "8082:8082" # Prometheus metrics
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
    networks:
      - vDrive-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ===================
  # Zookeeper (Kafka coordination)
  # ===================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vDrive-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: ruok,stat,srvr
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/commands/ruok || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vDrive-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ===================
  # Kafka Event Bus
  # ===================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vDrive-kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - vDrive-network
    depends_on:
      zookeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ===================
  # Kafka UI (Admin Interface)
  # ===================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vDrive-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: vDrive
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vDrive-network
    depends_on:
      kafka:
        condition: service_healthy

  # ===================
  # Kafka Topic Initialization
  # ===================
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vDrive-kafka-init
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      cub kafka-ready -b kafka:9092 1 60

      echo 'Creating Kafka topics...'

      # Upload events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic upload.initiated --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic upload.completed --config retention.ms=604800000

      # Asset processing events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 --topic asset.processing --config retention.ms=259200000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 12 --replication-factor 1 --topic asset.processed --config retention.ms=604800000

      # Face detection events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic face.detected --config retention.ms=604800000

      # Webhook events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic webhook.pending --config retention.ms=259200000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic webhook.dlq --config retention.ms=2592000000

      # Notification events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic notification.send --config retention.ms=259200000

      # Gallery events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic gallery.created --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic gallery.published --config retention.ms=604800000

      # User events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic user.registered --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic user.subscription.changed --config retention.ms=604800000

      # AI/Search events (Phase 4.3 - Semantic Search & RAG)
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 6 --replication-factor 1 --topic asset.embedding.generated --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic search.query.logged --config retention.ms=2592000000

      echo 'Kafka topics created successfully!'
      kafka-topics --list --bootstrap-server kafka:9092
      "
    networks:
      - vDrive-network
    depends_on:
      kafka:
        condition: service_healthy

  # ===================
  # Prometheus (Metrics Collection)
  # ===================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: vDrive-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../monitoring/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vDrive-network
    deploy:
      resources:
        limits:
          memory: 1G

  # ===================
  # Grafana (Dashboards)
  # ===================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: vDrive-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - ../monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../monitoring/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vDrive-network
    depends_on:
      - prometheus

  # ===================
  # Alertmanager (Alerts)
  # ===================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vDrive-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yaml'
      - '--storage.path=/alertmanager'
    ports:
      - "9094:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/healthy || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vDrive-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ===================
  # Loki (Log Aggregation)
  # ===================
  loki:
    image: grafana/loki:3.0.0
    container_name: vDrive-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vDrive-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ===================
  # Promtail (Log Shipping)
  # ===================
  promtail:
    image: grafana/promtail:3.0.0
    container_name: vDrive-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ../monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vDrive-network
    depends_on:
      - loki

  # ===================
  # Redis Exporter (Metrics)
  # ===================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: vDrive-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - vDrive-network
    depends_on:
      redis:
        condition: service_healthy

  # ===================
  # Postgres Exporter (Metrics)
  # ===================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: vDrive-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-vDrive}:${POSTGRES_PASSWORD:-vDrive_dev_password}@postgres:5432/${POSTGRES_DB:-vDrive}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - vDrive-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===================
  # Kafka Exporter (Metrics)
  # ===================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: vDrive-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    ports:
      - "9308:9308"
    networks:
      - vDrive-network
    depends_on:
      kafka:
        condition: service_healthy

  # ===================
  # Flower (Celery Monitoring)
  # ===================
  flower:
    image: mher/flower:latest
    container_name: vDrive-flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      FLOWER_PORT: 5555
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "5555:5555"
    networks:
      - vDrive-network
    depends_on:
      redis:
        condition: service_healthy

  # ===========================================
  # Website Service (Astro - Public Site)
  # www.vdrive.io - Marketing, Blog, Docs
  # ===========================================
  website:
    build:
      context: ../../services/website
      dockerfile: Dockerfile
      args:
        SITE_URL: ${WEBSITE_URL:-https://www.vdrive.io}
        APP_URL: ${APP_URL:-https://app.vdrive.io}
    image: ghcr.io/vdrive/website:${VERSION:-latest}
    container_name: vDrive-website
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-8020}:8020"
    environment:
      NODE_ENV: production
      SITE_URL: ${WEBSITE_URL:-https://www.vdrive.io}
      APP_URL: ${APP_URL:-https://app.vdrive.io}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8020/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vDrive-network
    labels:
      - "traefik.enable=true"
      # HTTP Router - Public Website
      - "traefik.http.routers.website.rule=Host(`www.vdrive.io`) || Host(`vdrive.io`)"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.tls.certresolver=letsencrypt"
      - "traefik.http.routers.website.priority=200"
      - "traefik.http.routers.website.middlewares=security-headers@file"
      # Service
      - "traefik.http.services.website.loadbalancer.server.port=8020"
      - "traefik.http.services.website.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.website.loadbalancer.healthcheck.interval=10s"
      # Prometheus metrics
      - "prometheus.io/scrape=false"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ===========================================
  # Frontend App (React - Authenticated App)
  # app.vdrive.io - Main Application
  # ===========================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-https://app.vdrive.io/api}
        VITE_WEBSITE_URL: ${WEBSITE_URL:-https://www.vdrive.io}
    image: ghcr.io/vdrive/frontend:${VERSION:-latest}
    container_name: vDrive-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      NODE_ENV: production
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vDrive-network
    labels:
      - "traefik.enable=true"
      # HTTP Router - App Frontend
      - "traefik.http.routers.frontend.rule=Host(`app.vdrive.io`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.priority=200"
      - "traefik.http.routers.frontend.middlewares=security-headers@file"
      # Service
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=10s"
      # Prometheus metrics
      - "prometheus.io/scrape=false"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ===========================================
  # Backend API Service
  # Port 8000 - Core API
  # ===========================================
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ghcr.io/vdrive/backend:${VERSION:-latest}
    container_name: vDrive-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      SERVICE_NAME: backend
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vDrive}:${POSTGRES_PASSWORD:-vDrive_dev_password}@postgres:5432/${POSTGRES_DB:-vDrive}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ALGORITHM: EdDSA
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vDrive-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health"
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8000"
      - "prometheus.io/path=/metrics"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ===========================================
  # Onboarding Service
  # Port 8006 - User Registration & Verification
  # ===========================================
  onboarding-service:
    build:
      context: ../../services/onboarding-service
      dockerfile: Dockerfile
    image: ghcr.io/vdrive/onboarding-service:${VERSION:-latest}
    container_name: vDrive-onboarding
    restart: unless-stopped
    ports:
      - "${ONBOARDING_SERVICE_PORT:-8006}:8006"
    environment:
      SERVICE_NAME: onboarding-service
      PORT: "8006"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vDrive}:${POSTGRES_PASSWORD:-vDrive_dev_password}@postgres:5432/${POSTGRES_DB:-vDrive}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMAIL_VERIFICATION_EXPIRY_HOURS: "24"
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vDrive-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onboarding.rule=PathPrefix(`/api/v1/onboarding`)"
      - "traefik.http.routers.onboarding.priority=125"
      - "traefik.http.services.onboarding.loadbalancer.server.port=8006"
      - "traefik.http.services.onboarding.loadbalancer.healthcheck.path=/health"
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8006"
      - "prometheus.io/path=/metrics"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ===========================================
  # Gallery Service
  # Port 8004 - Gallery Management & Public Viewing
  # ===========================================
  gallery-service:
    build:
      context: ../../services/gallery-service
      dockerfile: Dockerfile
    image: ghcr.io/vdrive/gallery-service:${VERSION:-latest}
    container_name: vDrive-gallery
    restart: unless-stopped
    ports:
      - "${GALLERY_SERVICE_PORT:-8004}:8004"
    environment:
      SERVICE_NAME: gallery-service
      PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vDrive}:${POSTGRES_PASSWORD:-vDrive_dev_password}@postgres:5432/${POSTGRES_DB:-vDrive}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-vdrive}
      R2_ENDPOINT: ${R2_ENDPOINT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-EdDSA}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vDrive-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gallery.rule=PathPrefix(`/api/v1/galleries`)"
      - "traefik.http.routers.gallery.priority=140"
      - "traefik.http.services.gallery.loadbalancer.server.port=8004"
      - "traefik.http.services.gallery.loadbalancer.healthcheck.path=/health"
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8004"
      - "prometheus.io/path=/metrics"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

networks:
  vDrive-network:
    driver: bridge
    name: vDrive-network

volumes:
  postgres_data:
    name: vDrive-postgres-data
  redis_data:
    name: vDrive-redis-data
  traefik_certs:
    name: vDrive-traefik-certs
  zookeeper_data:
    name: vDrive-zookeeper-data
  zookeeper_log:
    name: vDrive-zookeeper-log
  kafka_data:
    name: vDrive-kafka-data
  prometheus_data:
    name: vDrive-prometheus-data
  grafana_data:
    name: vDrive-grafana-data
  alertmanager_data:
    name: vDrive-alertmanager-data
  loki_data:
    name: vDrive-loki-data
