# vDrive Website Service Docker Compose
# Public marketing pages microservice
#
# Usage: docker compose -f docker-compose.frontend.yml up --build
#
# Architecture:
# ┌─────────────────────────────────────────────────────────────┐
# │                     Traffic Flow                            │
# ├─────────────────────────────────────────────────────────────┤
# │  Visitors ──> Website (localhost:8020 / vdrive.io)         │
# │                    │                                        │
# │                    ├── Click "Sign Up" ──> Frontend (app)  │
# │                    └── Click "Login"   ──> Frontend (app)  │
# │                                                             │
# │  Frontend runs locally: npm run dev (localhost:5173)       │
# └─────────────────────────────────────────────────────────────┘
#
# Services:
# - Website (Docker):   http://localhost:8020  (vdrive.io)
# - Frontend (Local):   http://localhost:5173  (npm run dev)

name: vdrive-website

services:
  # ===================
  # Website Service - Public Marketing Pages
  # Domain: vdrive.io, www.vdrive.io
  # Purpose: SEO, conversion, public content, landing pages
  # Tech: Astro (static site generator)
  # ===================
  website:
    build:
      context: ./services/website
      dockerfile: Dockerfile
      args:
        SITE_URL: http://localhost:8020
        APP_URL: http://localhost:5173
    container_name: vdrive-website
    ports:
      - "8020:8020"
    environment:
      - SITE_URL=http://localhost:8020
      - APP_URL=http://localhost:5173
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8020/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`vdrive.io`) || Host(`www.vdrive.io`) || Host(`localhost`)"
      - "traefik.http.services.website.loadbalancer.server.port=8020"
